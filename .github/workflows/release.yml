name: Release

# Build release binaries and attach them to a GitHub release whenever a
# version tag (e.g. "0.3.2" — no "v" prefix, matching existing tags) is pushed:
#
#   git tag 0.3.7 && git push origin 0.3.7

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13 was retired in Dec 2025; macos-15-intel is the last
          # Intel image (supported until Fall 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        # --locked works because the local post-commit hook keeps Cargo.lock's
        # `dan` version entry in sync with Cargo.toml on every commit.
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          name="dan-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/dan.exe" "$name/"
            7z a "${name}.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/dan" "$name/"
            strip "$name/dan" || true
            tar czf "${name}.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dan-${{ matrix.target }}
          path: |
            dan-*.tar.gz
            dan-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release already exists (e.g. re-run): just refresh the assets.
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "dan $tag" \
              --generate-notes
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Regenerate formula and push to dfallman/homebrew-tap
        env:
          # Fine-grained PAT with contents:write on dfallman/homebrew-tap.
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN secret not set; skipping tap update."
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          sha() { shasum -a 256 "artifacts/dan-${tag}-$1.tar.gz" | cut -d' ' -f1; }

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dfallman/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/dan.rb << EOF
          # typed: false
          # frozen_string_literal: true

          # This formula is regenerated automatically by the release workflow in
          # dfallman/dan (.github/workflows/release.yml) on every tagged release.
          class Dan < Formula
            desc "Fast, friendly, zero-fuss terminal text editor"
            homepage "https://github.com/dfallman/dan"
            version "${tag}"
            license "GPL-3.0-only"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dfallman/dan/releases/download/${tag}/dan-${tag}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              else
                url "https://github.com/dfallman/dan/releases/download/${tag}/dan-${tag}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/dfallman/dan/releases/download/${tag}/dan-${tag}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              else
                url "https://github.com/dfallman/dan/releases/download/${tag}/dan-${tag}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "dan"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dan --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dan.rb
          git diff --cached --quiet && { echo "Formula unchanged."; exit 0; }
          git commit -m "dan ${tag}"
          git push
